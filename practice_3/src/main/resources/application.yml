spring:
  application:
    name: practice_3

  datasource:
    url: jdbc:postgresql://localhost:5432/practice4
    username: postgres
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate        # схема создаётся через schema.sql, Hibernate только проверяет
    show-sql: false
    open-in-view: false         # отключаем — LAZY загружаем явно через JOIN FETCH

  sql:
    init:
      mode: always              # schema.sql и data.sql запускаются при каждом старте

  data:
    web:
      pageable:
        max-page-size: 100      # ограничиваем максимальный размер страницы

store:
  delivery:
    free-from: 15000
    regions: [ALA, AST, SHY]
    sla-window: PT48H
  notify:
    telegram:
      enabled: false
