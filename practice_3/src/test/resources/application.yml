spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false

  flyway:
    enabled: false

  cache:
    type: caffeine
    cache-names: quotes, regions
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

  kafka:
    admin:
      auto-create: false
    listener:
      auto-startup: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: quote-analytics-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.example.practice_3.delivery.events

store:
  delivery:
    free-from: 15000
    regions: [ALA, AST, SHY]
    sla-window: PT48H
  notify:
    telegram:
      enabled: false

services:
  tariff:
    base-url: http://localhost:8089
    connect-timeout: 1s
    read-timeout: 2s
