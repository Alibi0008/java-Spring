spring:
  application:
    name: practice_3

  datasource:
    url: jdbc:postgresql://localhost:5432/practice4
    username: postgres
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate        # схема управляется через Flyway, Hibernate только валидирует
    show-sql: false
    open-in-view: false         # отключаем — LAZY загружаем явно через JOIN FETCH

  flyway:
    enabled: true
    baseline-on-migrate: true   # поддержка существующей схемы БД

  cache:
    type: caffeine
    cache-names: quotes, regions
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

  data:
    web:
      pageable:
        max-page-size: 100      # ограничиваем максимальный размер страницы

store:
  delivery:
    free-from: 15000
    regions: [ALA, AST, SHY]
    sla-window: PT48H
  notify:
    telegram:
      enabled: false

services:
  tariff:
    base-url: http://localhost:8089
    connect-timeout: 1s
    read-timeout: 2s

resilience4j:
  retry:
    instances:
      tariff:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      tariff:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
